# The judge's self-consistency gates. Bash/python plus the reference
# evaluator's own crate (ref/, ADR-0015: stable Rust pinned by
# ref/rust-toolchain.toml, ZERO external crates — the only network use is the
# toolchain download, cached). No compiler of the language under judgment.
# Required for merge into main.
name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract ledger traceability (two-repo mode)
        run: bash scripts/check-contracts.sh
      - name: Contract provenance — requirements precede behaviour, measured
        run: python3 scripts/check-contract-provenance.py
      - name: ALS element coverage (ledger side)
        run: bash scripts/check-als-element-coverage.sh
      - name: Derived documents are regenerated, not edited
        run: |
          bash docs/contracts/generate-readme.sh      | diff -u - docs/contracts/README.md
          bash docs/contracts/generate-conformance.sh | diff -u - docs/contracts/conformance.md
          bash docs/specs/als/generate-readme.sh      | diff -u - docs/specs/als/README.md
      - name: Every relative link and anchor resolves
        run: bash scripts/check-links.sh
      - name: ALS requirements standard (ids, prefixes, vocabulary)
        run: bash scripts/check-als-style.sh
      - name: ALS validation records — reviews bound to the text they covered
        run: bash scripts/check-als-validation.sh
      - name: Workflow files parse strictly
        run: bash scripts/check-workflows.sh
      - name: Runner compiles and documents itself
        run: |
          python3 -m py_compile scripts/conformance.py
          python3 scripts/conformance.py --help > /dev/null
      - name: The judge's tools carry their own verification (DO-330)
        run: bash scripts/check-gate-verification.sh
      - name: Runner self-test — every verdict class fails for its reason
        run: python3 scripts/selftest-conformance.py
      - name: Runner structural coverage under the self-test (line, exact floor)
        run: python3 scripts/check-runner-coverage.py
      - name: Reference evaluator — pinned stable toolchain (ref/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ref/target
          key: ref-${{ runner.os }}-1.95.0-${{ hashFiles('ref/Cargo.lock', 'ref/src/**') }}
      - name: Reference evaluator builds (zero dependencies, stable only)
        run: cargo build --release --quiet
        working-directory: ref
      - name: Reference evaluator is independent (ADR-0015 clauses 1/4/5/6)
        run: bash scripts/check-ref-independence.sh
      - name: Reference evaluator reproduces the λ_almd kernel corpus (agreement 1.0, twice)
        run: python3 scripts/check-ref-kernel.py --ref ref/target/release/als-ref
      - name: Reference evaluator totality-or-abstain and the abstain ledger (shrink-only)
        run: python3 scripts/check-ref-totality.py --ref ref/target/release/als-ref
