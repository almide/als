# GATE VERIFICATION LEDGER (almide/als) — who watches the watchmen.
#
# Every verdict-bearing tool in this repository carries a row classifying HOW
# we know the tool itself can fail correctly, with a durable evidence pointer.
# The judge's tools ARE verification tools (DO-330): a gate nobody has ever
# seen fail is possibly decorative, and this repository's verdicts justify
# trusting implementations — so the debt is tracked here, shrink-only.
# Enforced by scripts/check-gate-verification.sh: every enumerated tool needs
# exactly one row, stale rows fail, a non-UNVERIFIED row needs `evidence`,
# and the UNVERIFIED count may only SHRINK (ceiling below).
#
# Classes (shared vocabulary with the implementation's ledger):
#   MUTATION_TESTED — a deliberate corruption of the tool's input/ledger was
#                     demonstrated to FAIL the tool (recorded where).
#   NEGATIVE_TESTED — a forged/violating input was demonstrated to FAIL.
#   EXERCISED       — both verdict directions observed in real operation.
#   UNVERIFIED      — no recorded evidence the tool can fail correctly.
#
# unverified_ceiling = "0"

[[gate]]
path = "scripts/check-contracts.sh"
class = "MUTATION_TESTED"
evidence = "Inherited from the implementation's ledger (F1 2026-07-04 spec-resolution mutation; the 2026-08-16 SIGPIPE membership-race repair with 12 documented one-line mutations in the script's own footer). Two-repo mode re-verified at extraction (2026-08-20, als founding session): removing a judge-resident fixture (spec/wasm_cross/float_parse.almd) flipped the gate red with C-024 named in both the missing-evidence and broken-symmetry directions; restore returned green."

[[gate]]
path = "scripts/check-als-element-coverage.sh"
class = "NEGATIVE_TESTED"
evidence = "Implementation-ledger lineage: unresolvable section (ALS-Z999) and dropped-row UNCLASSIFIED each demonstrated to fail before first green, with the below-ceiling ratchet demand firing in both. Two-repo split preserved both directions: ledger-side checks run here (section resolution, ceiling), enumeration defers loudly — never silently — without ALS_IMPL_ROOT."

[[gate]]
path = "scripts/check-links.sh"
class = "EXERCISED"
evidence = "PR #3 (2026-08-20): on its FIRST run the anchor check caught a live defect — the new ALS index generator's slugger diverged from the gate's on full-width punctuation (dead anchor into text-and-numbers.md) — red on the bug, green after the two sluggers were unified into one law. Both directions observed in real operation."

[[gate]]
path = "scripts/check-als-style.sh"
class = "EXERCISED"
evidence = "PR #4 (2026-08-20): first run found 6 chapters missing their `> Last updated:` header (red), green after repair; the class it was built for — 13 chapter-ambiguous section ids, one three-ways with citations already split across meanings — was repaired in the same PR and the uniqueness + prefix-registry checks pin it closed. The registry-missing path exits 2."

[[gate]]
path = "scripts/check-als-validation.sh"
class = "NEGATIVE_TESTED"
evidence = "Landing run (2026-08-20), each restored to green: a forged row with a wrong hash (STALE, plus the ceiling's below-direction); a correct --stamp row without ratcheting the ceiling (BELOW the ceiling — ratchet it down); the same row with the ceiling ratcheted (green) then verdict=revise without an issue (red); a row for ALS-Z999 (STALE row — section no longer exists); the ceiling lowered with no rows (exceed); and the live case — a valid ALS-T1 row followed by one inserted line in that section's text flipped the row STALE with both hashes named. Zero-sections-enumerated is a hard error. Side finding of the first run: STANDARD.md called ALS-S4 'retired forever' while strings.md still owns a live ALS-S4 — the wording was corrected in the same PR."

[[gate]]
path = "scripts/check-runner-coverage.py"
class = "NEGATIVE_TESTED"
evidence = "Landing run (2026-08-20): floor hand-set to 99.0 → 'BELOW the floor' red; floor hand-set to 10.0 → 'ABOVE the floor — ratchet it up' red; the self-test made red (declared scenario count 21→20) → 'the runner self-test is red — coverage of a failing verification is not evidence' with the self-test output attached, exit 1; three consecutive measurements identical (85.1% of 261). Measurement honesty checked the other way too: the first denominator counted the imports and the hook (structurally untraceable) as uncovered — module-level lines and the hook's own functions are now excluded and the excluded count is recorded in the ledger, not hidden."

[[gate]]
path = "scripts/check-workflows.sh"
class = "NEGATIVE_TESTED"
evidence = "Inherited verbatim from the implementation (#1234): a forged workflow with a duplicate `if:` key rejected with the key named, exit 1; the empty-glob path fails loud."

[[gate]]
path = "scripts/check-gate-verification.sh"
class = "NEGATIVE_TESTED"
evidence = "Bootstrap run (PR #5, 2026-08-20): before first green, a mis-pathed row failed as STALE and this script's own missing row failed as UNCLASSIFIED — both fail directions demonstrated (same bootstrap protocol as the implementation's ledger)."

[[gate]]
path = "scripts/conformance.py"
class = "NEGATIVE_TESTED"
evidence = "scripts/selftest-conformance.py: 21 scenarios drive the real runner over a scripted stub implementation through every verdict class per leg — cross (stdout/stderr/exit divergence, build refusal, @xt-allow tracked, healed-allow STALE), fail (success-is-failure, wrong message, split legs, missing header is red never skipped, @xf-allow, stale), diag (accepted-broken, missing code, missing hint, unfixable fix), suite (failed-count red even at exit 0) — asserting both the process exit AND the statement's per-leg counters. A dropped scenario fails the declared-count guard (which fired on its own landing run: 21 written, 20 declared). Runs in the gates workflow on every push. 2026-08-21: the ref leg (verdict legs == REFERENCE, TOR-8) added with nine selftest scenarios — including the co-drift class (targets agree with each other, both differ from the reference → red), abstain-is-not-a-verdict, malformed-protocol-is-red, and @ref-allow in both directions."

[[gate]]
path = "scripts/selftest-conformance.py"
class = "EXERCISED"
evidence = "Its declared-count guard fired on the landing run (21 scenarios vs a declared 20) and went green only after the declaration was corrected — the harness's own red direction observed before first green. Each scenario asserts a red and its reason, so a runner regression flips at least one scenario. 2026-08-21: grown from 21 to 30 scenarios with the ref leg (stub als-ref scripted per file; the count guard moved 21→30 so a dropped scenario stays loud)."

[[gate]]
path = "scripts/doctest.py"
class = "NEGATIVE_TESTED"
evidence = "NEGATIVE_TESTED at landing (PR #6, 2026-08-20: a planted lying example flipped it red; zero-blocks and both ceiling directions fail). Made permanent in the burn-down PR the same day: `scripts/doctest.py --selftest` plants 25 scenarios across every verdict class — a failing assertion is red (blocks are RUN, not only checked), a negative example that compiles or fails with a different code is red, a project whose test lies or whose module is broken is red, a project build-fail that fails for another reason is red, an un-imported module directory is red, an unknown mode is red, zero blocks is red, both ceiling directions are red, and the green cases hold — run in the conformance workflow before the doctest itself. Burn-down measurement: 21 fragments and 163 bare fences at introduction, both 0 afterwards with 167 judged examples holding; the burn-down surfaced nine spec-vs-compiler divergences (listed in that PR) — the instrument found real defects on its first full pass."

[[gate]]
path = "scripts/check-contract-provenance.py"
class = "NEGATIVE_TESTED"
evidence = "Landing run (2026-08-20): six fail directions demonstrated against the freshly written ledger, each restored to green — a dropped row (C-150: 'no provenance row' + the ceiling's below-direction fired together); a hand-edited class (C-001 retroactive→contemporaneous: 'does not follow from entry … / release … — recorded classes are derived, not declared'); ceiling +1 ('BELOW the ceiling — ratchet it down'); ceiling −1 ('exceeds ceiling'); a contract renamed in the ledger (STALE row for the old id + missing row for the new); every class forced to unmeasured ('zero measured rows — a broken instrument is not a pass'). --write refuses a shallow clone (rev-list < 500)."

[[gate]]
path = "scripts/edition-readiness.py"
class = "NEGATIVE_TESTED"
evidence = "Landing run (PR #6, 2026-08-20): --almide /nonexistent produced [FAIL] spec doctest and verdict NOT READY (exit 1); the full run with the real binary produced READY with 13 checks and the two honest WARNs (feature branch, dirty tree). FATAL direction covered by the tag-shape/tag-exists checks."

[[gate]]
path = "scripts/check-ref-independence.sh"
class = "NEGATIVE_TESTED"
evidence = "Landing run (2026-08-21): fired on its first real run — rustfmt drift in the freshly written crate (red, green after `cargo fmt`) — and its dependency check fired falsely on the [[bin]] `path =` line (repaired to read only [dependencies]; both directions seen). clippy.toml's disallowed-methods caught `str::lines` in main.rs before the gate existed (clause 5 is structural: the lint failed the build)."

[[gate]]
path = "scripts/check-ref-kernel.py"
class = "NEGATIVE_TESTED"
evidence = "Landing run (2026-08-21): the first evaluator build was run against the 49 λ_almd programs through this gate (49/49 byte-identical, twice — the floor of 1.0 held on the first pass); red directions demonstrated on a scratch copy before landing: a corrupted .expected (trace differs, expected/got printed), a program made to abstain (ABSTAIN named as a failure — the kernel fragment admits no abstain), an empty corpus directory (\"kernel corpus missing\" — a broken instrument is not a pass)."

[[gate]]
path = "scripts/check-ref-totality.py"
class = "NEGATIVE_TESTED"
evidence = "Landing run (2026-08-21): measured 602 programs, 173 evaluated, 429 abstains in 152 classes, 0 faults, and wrote proofs/ref-abstain.toml; red directions demonstrated before landing: the evaluator's early `Fatal` on type mismatches surfaced as FAULTS here (red) until re-classified as the `semantics:type-mismatch` abstain (a finding, not a fault); a hand-edited ceiling fires BELOW/EXCEEDS; a missing ledger names `--write`."

[[gate]]
path = "scripts/check-ratchet-separation.sh"
class = "NEGATIVE_TESTED"
evidence = "Landing run (2026-08-21), staged mode: a ceiling raised together with another file → red on both counts (separation, and no dated line); raised alone without a dated line → red (date); raised alone with `# 2026-08-21: …` → green; lowered together with other files → green (tightening rides along); a regenerated floor lowered alone → green, the same plus another file → red. Range mode over the day's own history flagged exactly the two commits that had raised unvalidated_ceiling alongside new sections (75c4bc84f 110→116, fbec1e712 116→127) — the instrument bit its author first; the two ref-abstain ratchets (solo commits, regenerated ledger) passed. A first landing bug (the index was queried as `::path`, so staged loosenings were invisible and every scenario passed) was caught by the scenarios themselves before the gate was wired. First real range (als #42, the other session's PR): a ref-abstain ceiling TIGHTENING rode along with its cause and the gate passed — the green direction observed in operation."
